<div class="container mt-4">
  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ voyage?.destination }}</h5>
          <p class="card-text">{{ voyage?.description }}</p>
          <p class="card-text">{{ voyage?.prix | currency:'EUR' }}</p>
          <button (click)="deleteVoyage(voyage?.id)" class="btn btn-danger">Supprimer ce voyage</button>
        </div>
      </div>
    </div>
  </div>
</div>
